name: 构建发布 (Windows .NET 8)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: windows-x86_64
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 构建解决方案并运行单元测试与集成测试
        run: |
          dotnet build ScanBMC.sln -c Release
          dotnet test ScanBMC.sln -c Release --no-build --verbosity normal

      - name: 计算版本号
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            VER=$(grep -oPm1 "(?<=<Version>)[^<]+" Directory.Build.props)
          fi
          echo "VER=${VER}" >> "$GITHUB_ENV"

      - name: 发布 Windows 单文件版 (自包含)
        if: github.event_name != 'pull_request'
        run: >
          dotnet publish src/ScanBMC.App/ScanBMC.App.csproj
          -c Release -r win-x64 --self-contained true
          -p:Version=${{ env.VER }}
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -o publish/win-x64

      - name: 冒烟测试打包产物
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          $env:SCANBMC_GUI_SMOKE = "1"
          $p = Start-Process -FilePath "publish/win-x64/ScanBMC.exe" -Wait -PassThru
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }

      - name: 重命名产物
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          mkdir -p release_artifacts
          mv publish/win-x64/ScanBMC.exe "release_artifacts/ScanBMC-${VER}-windows-x64.exe"
          ls -lh release_artifacts/

      - name: 上传构建产物 (Artifact)
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ScanBMC-windows-x64
          path: release_artifacts/*
          if-no-files-found: error
          retention-days: 14

      - name: 发布到 GitHub Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release_artifacts/*
          name: ScanBMC ${{ env.VER }}
          body: |
            ## ScanBMC ${{ env.VER }} — Windows 原生单文件版 (.NET 8 WPF)

            双击 `ScanBMC-${{ env.VER }}-windows-x64.exe` 即可运行，无需安装 Python 或 .NET 运行时。
