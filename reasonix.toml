allow = ["Bash=cd /Users/ion/xm/scanbmc && python3 - <<'EOF'\nimport scanbmc as sb\n\n# 构造一个真实的\"最小失败应答\"：RMCP 头(4) + 会话头(9) + 长度(1) + IPMI 消息 7 字节 = 21 字节\n# IPMI 消息: rsAddr=0x81 netFn=0x1C checksum=0x63 rqAddr=0x20 rqSeq=0x00 cmd=0x38 completion=0xC1\nbody = bytes([0x81, 0x1C, 0x63, 0x20, 0x00, 0x38, 0xC1])\nresp21 = b\"\\x06\\x00\\xff\\x07\" + b\"\\x00\" * 9 + bytes([len(body)]) + body\nprint(\"总长度:\", len(resp21))\n\n# 当前行为\ninfo = sb.parse_ipmi_response(resp21)\nprint(\"21 字节失败应答 →\", info)\n\n# 对照组：同一应答但多塞一个字节（22 字节）\nresp22 = resp21 + b\"\\x00\"\nprint(\"22 字节 →\", sb.parse_ipmi_response(resp22))\nEOF", "Bash=cd /Users/ion/xm/scanbmc && python3 - <<'EOF'\nimport socket, threading, time\nimport scanbmc as sb\n\n# 假 BMC：只回 21 字节的 IPMI 失败应答（completion=0xC1），不回 ASF、不开 TCP\nsock = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)\nsock.bind((\"127.0.0.1\", 0))\nport = sock.getsockname()[1]\nstop = threading.Event()\n\ndef serve():\n    sock.settimeout(0.2)\n    while not stop.is_set():\n        try:\n            data, addr = sock.recvfrom(2048)\n        except OSError:\n            break\n        if len(data) > 3 and data[3] == 0x07:\n            body = bytes([0x81, 0x1C, 0x63, 0x20, 0x00, 0x38, 0xC1])  # 7 字节，21 字节总长\n            sock.sendto(b\"\\x06\\x00\\xff\\x07\" + b\"\\x00\" * 9 + bytes([len(body)]) + body, addr)\n\nthreading.Thread(target=serve, daemon=True).start()\nold = sb.IPMI_UDP_PORT\nsb.IPMI_UDP_PORT = port\ntry:\n    results = sb.scan([\"127.0.0.1\"], sb.ScanConfig(tcp_ports=[], workers=4, timeout=1.0, retries=0, progress=False))\n    if results:\n        h = results[0]\n        print(\"存活:\", h.is_alive, \"| 置信度:\", h.confidence, \"| completion_code:\", h.ipmi.get(\"completion_code\") if h.ipmi else None)\n        print(\"证据:\", h.evidence)\n    else:\n        print(\"!! 主机被漏报\")\nfinally:\n    sb.IPMI_UDP_PORT = old\n    stop.set()\n    sock.close()\nEOF"]
